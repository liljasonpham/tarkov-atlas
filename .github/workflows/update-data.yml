# Daily quest data refresh.
# Every day GitHub runs this on its own computers: it downloads the latest quests, maps,
# bosses and loot from tarkov.dev, rebuilds the data files, runs the tests, and if anything
# really changed, commits it. GitHub Pages then republishes the site by itself.
# You can also run it by hand: Actions tab -> "Update quest data" -> "Run workflow".
name: Update quest data

on:
  schedule:
    - cron: "17 9 * * *" # every day at 09:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      # Stops here (and changes nothing) if tarkov.dev is down or the new data looks broken.
      - name: Download from tarkov.dev and rebuild data
        run: node tools/update-data.js

      - name: Re-link wiki photos to objectives
        run: node tools/link-photos.js

      - name: Rebuild story pins
        run: node tools/build-story-pins.js

      - name: Run the tests
        run: node --test

      - name: Skip if only the date changed
        id: diff
        run: echo "result=$(node tools/drop-date-only-changes.js)" >> "$GITHUB_OUTPUT"

      - name: Commit the new data
        if: steps.diff.outputs.result == 'changed'
        run: |
          git config user.name "tarkov-atlas-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ index.html planner.html
          git commit -m "Daily data refresh from tarkov.dev ($(date -u +%F))"
          git push
